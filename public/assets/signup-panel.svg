<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract composition of app interfaces being assembled">
  <title>Souqi — apps assembling themselves</title>
  <defs>
    <!-- Brand base: the navy from login.html, lifted toward the accent. -->
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#0b1e33"/>
      <stop offset="52%"  stop-color="#102a45"/>
      <stop offset="100%" stop-color="#0d5f86"/>
    </linearGradient>

    <!-- Two colour orbs. Radial + heavy blur is what reads as light in a
         space rather than as a flat circle. -->
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1aa6df" stop-opacity=".85"/>
      <stop offset="60%"  stop-color="#1aa6df" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#1aa6df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity=".72"/>
      <stop offset="62%"  stop-color="#7c3aed" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#63d0ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#63d0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass cards: a top-lit translucent panel. -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1aa6df"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
    <!-- Fine grain: kills the banding large smooth gradients show on
         8-bit panels. Very low opacity, applied over everything. -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="1600"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="1600" fill="url(#base)"/>
    <rect width="1200" height="1600" fill="url(#grid)"/>

    <!-- Light. Placed off-centre and off-canvas so the composition reads as
         a crop of something larger, not a centred logo. -->
    <ellipse cx="880" cy="330"  rx="520" ry="470" fill="url(#orbA)" filter="url(#soft)"/>
    <ellipse cx="210" cy="1180" rx="560" ry="520" fill="url(#orbB)" filter="url(#softer)"/>
    <ellipse cx="640" cy="820"  rx="300" ry="280" fill="url(#orbC)" filter="url(#soft)"/>

    <!-- Floating UI fragments: the product's own subject matter, abstracted.
         Rotated as a group so they read as depth rather than a flat stack.
         Pushed right and down on purpose: the tagline sits at the panel's
         mid-LEFT, and an earlier version put the browser fragment directly
         behind it — its accent bar landed between two words of the
         headline. The art now occupies the right and lower field, leaving
         a clean band for type. -->
    <g transform="translate(330 300) rotate(-13 600 800)" opacity=".92">

      <!-- browser window -->
      <g transform="translate(232 430)">
        <rect width="560" height="360" rx="26" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
        <rect x="1" y="1" width="558" height="58" rx="25" fill="#ffffff" fill-opacity=".05"/>
        <circle cx="38" cy="30" r="7" fill="#ff5f57" fill-opacity=".85"/>
        <circle cx="62" cy="30" r="7" fill="#febc2e" fill-opacity=".85"/>
        <circle cx="86" cy="30" r="7" fill="#28c840" fill-opacity=".85"/>
        <rect x="120" y="20" width="300" height="20" rx="10" fill="#ffffff" fill-opacity=".08"/>
        <rect x="40"  y="100" width="300" height="30" rx="9"  fill="#ffffff" fill-opacity=".16"/>
        <rect x="40"  y="152" width="200" height="16" rx="8"  fill="#ffffff" fill-opacity=".09"/>
        <rect x="40"  y="196" width="150" height="40" rx="12" fill="url(#accentBar)"/>
        <rect x="330" y="100" width="190" height="190" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
        <path d="M355 250l40-52 34 40 30-34 46 60z" fill="#1aa6df" fill-opacity=".55"/>
        <circle cx="382" cy="146" r="15" fill="#63d0ff" fill-opacity=".65"/>
      </g>

      <!-- phone -->
      <g transform="translate(700 700)">
        <rect width="230" height="440" rx="40" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
        <rect x="82" y="18" width="66" height="16" rx="8" fill="#000" fill-opacity=".55"/>
        <rect x="26" y="62" width="140" height="22" rx="11" fill="#ffffff" fill-opacity=".16"/>
        <rect x="26" y="102" width="178" height="120" rx="16" fill="#ffffff" fill-opacity=".08"/>
        <rect x="26" y="240" width="178" height="18" rx="9" fill="#ffffff" fill-opacity=".09"/>
        <rect x="26" y="272" width="120" height="18" rx="9" fill="#ffffff" fill-opacity=".07"/>
        <rect x="26" y="322" width="178" height="44" rx="14" fill="url(#accentBar)"/>
      </g>

      <!-- code fragment -->
      <g transform="translate(150 890)">
        <rect width="420" height="250" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
        <rect x="34" y="44"  width="150" height="13" rx="6.5" fill="#7c3aed" fill-opacity=".75"/>
        <rect x="196" y="44" width="96"  height="13" rx="6.5" fill="#63d0ff" fill-opacity=".7"/>
        <rect x="56" y="82"  width="210" height="13" rx="6.5" fill="#ffffff" fill-opacity=".2"/>
        <rect x="56" y="120" width="150" height="13" rx="6.5" fill="#1aa6df" fill-opacity=".7"/>
        <rect x="80" y="158" width="240" height="13" rx="6.5" fill="#ffffff" fill-opacity=".14"/>
        <rect x="34" y="196" width="110" height="13" rx="6.5" fill="#ffffff" fill-opacity=".2"/>
      </g>
    </g>

    <!-- Two vignettes. The vertical one is ordinary depth; the HORIZONTAL
         one is doing real work — it darkens the left third where the
         tagline sits, so the type keeps contrast no matter which fragment
         drifts behind it. Without it the headline sat on glass panels and
         lost legibility mid-word. -->
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050d18" stop-opacity=".34"/>
      <stop offset="45%"  stop-color="#050d18" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#050d18" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="vigX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#071120" stop-opacity=".72"/>
      <stop offset="38%"  stop-color="#071120" stop-opacity=".34"/>
      <stop offset="70%"  stop-color="#071120" stop-opacity="0"/>
    </linearGradient>
    <rect width="1200" height="1600" fill="url(#vig)"/>
    <rect width="1200" height="1600" fill="url(#vigX)"/>

    <rect width="1200" height="1600" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
  </g>
</svg>
