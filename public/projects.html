<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Projects — Souqi</title>
<script>
(function(){var k="souqi-theme";try{var t=localStorage.getItem(k)||"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --paper:#faf7f2; --paper-2:#f3eee6; --card:#ffffff;
    --ink:#12202e; --ink-2:#5d6f80; --mut:#8b98a5;
    --accent:#1aa6df; --accent-2:#0f8ec4;
    --tint-2:#e7f5fd; --line:#e7e1d7;
    --disp:'Jost','Century Gothic',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  :root[data-theme="dark"]{
    --paper:#1c1917; --paper-2:#24211e; --card:#2a2622;
    --ink:#f0eadc; --ink-2:#a49e92; --mut:#7e766a;
    --tint:#3d3428; --tint-2:#2d2420;
    --stone:#2e2a26; --dark:#0a0908; --line:#3a352e; --navy-800:#0d0b0a;
    --accent:#1aa6df; --accent-2:#118cc0; --accent-ink:#e6edf3;
  }
  html{background:var(--paper)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit}
  button:focus, button:focus-visible, a:focus, a:focus-visible { outline: none !important; box-shadow: none !important; }
  h1,h2{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;margin:0}

  .ag-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
  .ag-history{position:sticky;top:0;align-self:flex-start;height:100vh;flex:0 0 auto;
    width:0;max-width:88vw;overflow:hidden;background:var(--paper);
    border-right:0 solid var(--line);transition:width .26s var(--ease);
    display:flex;flex-direction:column;z-index:100}
  .ag-history.on{width:290px;border-right:1px solid var(--line);overflow:visible !important}
  .ag-hist-head,.ag-hist-tabs,.ag-hist-foot{width:290px}
  .ag-hist-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
  .ag-hist-mark{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
  .ag-hist-mark svg{width:13px;height:13px;color:#fff}
  .ag-hist-close{margin-inline-start:auto;border:0;background:none;color:var(--ink-2);cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
  .ag-ws{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px 5px 5px;margin:4px 12px 9px;width:calc(100% - 24px);cursor:pointer;text-align:left}
  .ag-ws .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));font-weight:600;font-size:.74rem}
  .ag-ws .nm{flex:1;min-width:0;font-size:.87rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ag-ws svg{width:15px;height:15px;flex:none;color:var(--ink-2)}
  .ag-act{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:8px 11px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--ink);font-size:.87rem;cursor:pointer;width:calc(100% - 24px)}
  .ag-act svg{width:15px;height:15px;flex:none;color:var(--ink-2)}
  .ag-hist-tabs{display:flex;flex-direction:column;gap:2px;padding:2px 12px 10px;flex:1}
  .ag-hist-tab{width:100%;display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink);cursor:pointer;padding:9px 10px;border-radius:8px;font-size:.92rem;font-weight:400;text-align:left;transition:.14s}
  .ag-hist-tab svg{width:18px;height:18px;flex:none;color:var(--ink-2)}
  .ag-hist-tab:hover,.ag-hist-tab.on{background:var(--paper-2);font-weight:500}
  
  .ag-pv-toggle-btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 9px; padding: 6px 14px; height: 34px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.03); outline: none !important;
  }
  #agDeskSidebarToggle {
    position: fixed !important; top: 12px !important; left: 18px !important; z-index: 10000 !important;
  }
  .ag-pv-toggle-btn:hover { border-color: #cbd5e1; background: var(--paper-2); color: var(--ink); }
  .ag-pv-toggle-btn.on { background: var(--card); color: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .ag-pv-toggle-btn .pane-left { transition: fill 0.2s ease; fill: transparent; }
  .ag-pv-toggle-btn.on .pane-left { fill: var(--ink); }
  .ag-pv-toggle-btn svg { width: 16px; height: 16px; flex: none; }

  .ag-hist-head{display:flex;align-items:center;gap:10px;padding:12px 14px 4px 116px}
  .ag-hist-backdrop{position:fixed;inset:0;background:rgba(11,22,38,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
  .ag-hist-backdrop.on{opacity:1;pointer-events:auto}
  @media (max-width:900px){
    .ag-history{position:fixed;top:0;left:0;bottom:0;z-index:71}
  }
  .nav{display:flex;align-items:center;gap:16px;padding:14px clamp(18px,4vw,40px);border-bottom:1px solid var(--line);background:var(--paper)}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:1.1rem}
  .brand img{width:26px;height:26px;object-fit:contain;border-radius:4px}
  .nav .sp{margin-left:auto}
  .btn-g{padding:9px 15px;border:1px solid var(--line);border-radius:10px;font-size:.86rem;font-weight:600;transition:.16s;background:var(--card)}
  .btn-g:hover{border-color:#c6dbe7}
  .btn-d{padding:9px 17px;border-radius:10px;background:var(--accent);color:#fff;font-size:.86rem;font-weight:600;transition:.16s}
  .btn-d:hover{background:var(--accent-2)}

  .wrap{max-width:1180px;margin:0 auto;padding:clamp(26px,5vw,46px) clamp(18px,4vw,40px) 80px;width:100%}
  .phead{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .phead svg.ic{width:22px;height:22px;color:var(--ink)}
  .phead h1{font-size:clamp(1.5rem,3vw,1.9rem)}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .search{position:relative;width:min(260px,100%)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
  .search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;
    font:inherit;font-size:.9rem;background:var(--card);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--accent)}
  .fsel{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:.87rem;
    background:var(--card);color:var(--ink);cursor:pointer}
  .fsel:focus{outline:none;border-color:var(--accent)}
  .toolbar .sp{margin-left:auto}
  .viewtog{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .viewtog button{border:0;background:none;color:var(--mut);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .viewtog button:hover{color:var(--ink);background:var(--paper-2)}
  .viewtog button.on{background:var(--paper-2);color:var(--ink)}
  .viewtog button svg{width:16px;height:16px}
  .viewtog span{width:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;
    overflow:hidden;cursor:pointer;transition:.15s}
  .card:hover{border-color:#c6dbe7;box-shadow:0 8px 22px -12px rgba(11,22,38,.28);transform:translateY(-1px)}
  .thumb{height:128px;position:relative;background:var(--paper-2);display:grid;place-items:center}
  .thumb .tile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
    font-family:var(--disp);font-weight:700;font-size:1.3rem;color:#fff}
  .thumb .star{position:absolute;top:10px;right:10px;border:0;background:rgba(18,32,46,.06);color:var(--mut);
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .thumb .star:hover{background:rgba(18,32,46,.1);color:var(--ink)}
  .thumb .star.on{color:#e0a11a}
  .thumb .star svg{width:15px;height:15px}
  .thumb .star.on svg{fill:currentColor}
  .body{padding:12px 14px 14px}
  .body .t{font-size:.94rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .body .m{display:flex;align-items:center;gap:5px;font-size:.79rem;color:var(--mut);margin-top:4px}
  .body .m svg{width:12px;height:12px;flex:none}

  /* Placed AFTER the base .grid/.thumb/.body rules on purpose: this
     selector is no more specific than those, so source order decides —
     an identical block sitting earlier in the file did nothing at all. */
  @media (max-width:640px){
    /* auto-fill with a 220px minimum never fits two cards under ~460px,
       so it collapses to one column full-width on a phone — force 2 and
       scale the thumbnail/text down to match, same treatment as the
       Recent Projects grid in code.html. */
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .thumb{height:80px}
    .thumb .tile{width:32px;height:32px;font-size:1rem;border-radius:9px}
    .thumb .star{width:24px;height:24px}
    .thumb .star svg{width:13px;height:13px}
    .body{padding:9px 10px 11px}
    .body .t{font-size:.83rem}
    .body .m{font-size:.72rem;margin-top:3px}
  }

  .rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--paper-2)}
  .row .tile{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;flex:none;
    font-family:var(--disp);font-weight:700;font-size:.95rem;color:#fff}
  .row .t{flex:1;min-width:0;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .m{display:flex;align-items:center;gap:5px;font-size:.79rem;color:var(--mut);flex:none}
  .row .m svg{width:12px;height:12px}
  .row .star{flex:none;border:0;background:none;color:var(--mut);width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;cursor:pointer;transition:.15s}
  .row .star:hover{background:rgba(18,32,46,.06);color:var(--ink)}
  .row .star.on{color:#e0a11a}
  .row .star svg{width:15px;height:15px}
  .row .star.on svg{fill:currentColor}

  .empty{text-align:center;padding:80px 20px;color:var(--ink-2)}
  .empty h2{font-size:1.3rem;margin-bottom:8px;color:var(--ink)}
  .empty p{font-size:.92rem;max-width:40ch;margin:0 auto 20px;line-height:1.5}
  .loading{text-align:center;padding:60px 20px;color:var(--mut);font-size:.9rem}
</style>
</head>
<body>

<button type="button" class="ag-pv-toggle-btn on" id="agDeskSidebarToggle" title="Toggle Sidebar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="3.5"/>
    <path d="M9 3v18"/>
    <rect class="pane-left" x="3.8" y="3.8" width="5.2" height="16.4" rx="1" fill="transparent" stroke="none"/>

  <span>Sidebar</span>
</button>

<div class="ag-hist-backdrop" id="agHistBackdrop"></div>
<aside class="ag-history on" id="agHistory" aria-label="Your account">

    <span class="ag-hist-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4M6 8l-4 4 4 4M14.5 4l-5 16"/></svg></span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3.5"/>
        <path d="M9 3v18"/>
        <rect class="pane-left" x="3.8" y="3.8" width="5.2" height="16.4" rx="1" fill="var(--ink)" stroke="none"/>
      </svg>
      <span>Sidebar</span>
    </button>
  </div>

  <button type="button" class="ag-ws" onclick="location.href='/agent'">
    <span class="av">S</span>

  <button type="button" class="ag-act" onclick="location.href='/agent'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create something new</button>

  <div class="ag-hist-tabs" role="tablist">
    <a class="ag-hist-tab" href="/agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a class="ag-hist-tab on" href="/projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Projects</a>
    <a class="ag-hist-tab" href="/agent#favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>Favorites</a>
    <a class="ag-hist-tab" href="/agent#stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Stats</a>
    <a class="ag-hist-tab" href="/agent#settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
  </div>
</aside>

<div class="ag-main">
  <header class="nav">
    <a class="brand" href="/agent"><img src="/assets/logo.png" alt="Souqi"><span>Souqi</span></a>
    <span class="sp"></span>
    <a class="btn-g" href="/agent">Back to builder</a>
    <a class="btn-d" href="/pricing">See plans</a>
  </header>

  <div class="wrap">
    <div class="phead">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <h1>Projects</h1>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="q" placeholder="Search by name…" aria-label="Search projects">
      </div>
      <select class="fsel" id="fStatus" aria-label="Filter by status">
        <option value="">Any status</option>
        <option value="published">Published</option>
        <option value="private">Private</option>
      </select>
      <select class="fsel" id="fType" aria-label="Filter by artifact type">
        <option value="">Any artifact type</option>
        <option value="website">Website</option>
        <option value="webapp">Web App</option>
        <option value="dashboard">Dashboard</option>
        <option value="portfolio">Portfolio</option>
        <option value="mobile">Mobile</option>
      </select>
      <span class="sp"></span>
      <div class="viewtog" role="group" aria-label="View">
        <button type="button" id="vGrid" class="on" aria-label="Grid view" title="Grid view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
        <span></span>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { var d = document.createElement("span"); d.textContent = t == null ? "" : t; return d.innerHTML; }

  // Sidebar toggle
  var sb = $("agHistory"), bd = $("agHistBackdrop");
  var deskSbBtn = $("agDeskSidebarToggle"), closeBtn = $("agHistClose");
  if (deskSbBtn) {
    deskSbBtn.addEventListener("click", function() {
      var isShowing = sb.classList.toggle("on");
      deskSbBtn.classList.toggle("on", isShowing);
      if (bd && window.innerWidth <= 900) bd.classList.toggle("on", isShowing);
    });
  }
  if (closeBtn) {
    closeBtn.addEventListener("click", function() {
      if (sb) sb.classList.remove("on");
      if (deskSbBtn) deskSbBtn.classList.remove("on");
      if (bd) bd.classList.remove("on");
    });
  }
  if (bd) {
    bd.addEventListener("click", function() {
      if (sb) sb.classList.remove("on");
      if (deskSbBtn) deskSbBtn.classList.remove("on");
      if (bd) bd.classList.remove("on");
    });
  }

  var TYPE_COLOR = { website: "#1aa6df", webapp: "#7c5cff", dashboard: "#f59e0b", portfolio: "#ec4899", mobile: "#10b981" };
  function timeAgo(iso) {
    var s = (Date.now() - new Date(iso)) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    if (s < 86400 * 30) return Math.round(s / 86400) + "d ago";
    return Math.round(s / (86400 * 30)) + "mo ago";
  }

  var all = [];
  var view = "grid";
  var STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>';
  var META_PUB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>Published';
  var META_PRIV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Private';

  function currentFiltered() {
    var q = $("q").value.trim().toLowerCase();
    var status = $("fStatus").value, type = $("fType").value;
    return all.filter(function (p) {
      if (q && (p.title || "").toLowerCase().indexOf(q) < 0) return false;
      if (status === "published" && !p.published) return false;
      if (status === "private" && p.published) return false;
      if (type && p.buildType !== type) return false;
      return true;
    });
  }

  function renderGrid(list) {
    return '<div class="grid">' + list.map(function (p) {
      var title = p.title || "Untitled app";
      var color = TYPE_COLOR[p.buildType] || "#8b98a5";
      var star = p.favorite ? "on" : "";
      var meta = p.published ? META_PUB : META_PRIV;
      return '<a class="card" href="/agent/' + esc(p.slug) + '">'
        + '<span class="thumb"><span class="tile" style="background:' + color + '">' + esc(title.charAt(0).toUpperCase() || "A") + '</span>'
        + '<button type="button" class="star ' + star + '" data-slug="' + esc(p.slug) + '" data-fav="' + (p.favorite ? "1" : "0") + '" aria-label="Favorite" onclick="event.preventDefault()">' + STAR + '</button></span>'
        + '<span class="body"><span class="t">' + esc(title) + '</span>'
        + '<span class="m">' + meta + ' · ' + esc(timeAgo(p.updatedAt)) + '</span></span></a>';
    }).join("") + '</div>';
  }

  function renderRows(list) {
    return '<div class="rows">' + list.map(function (p) {
      var title = p.title || "Untitled app";
      var color = TYPE_COLOR[p.buildType] || "#8b98a5";
      var star = p.favorite ? "on" : "";
      var meta = p.published ? META_PUB : META_PRIV;
      return '<a class="row" href="/agent/' + esc(p.slug) + '">'
        + '<span class="tile" style="background:' + color + '">' + esc(title.charAt(0).toUpperCase() || "A") + '</span>'
        + '<span class="t">' + esc(title) + '</span>'
        + '<span class="m">' + meta + ' · ' + esc(timeAgo(p.updatedAt)) + '</span>'
        + '<button type="button" class="star ' + star + '" data-slug="' + esc(p.slug) + '" data-fav="' + (p.favorite ? "1" : "0") + '" aria-label="Favorite" onclick="event.preventDefault()">' + STAR + '</button></a>';
    }).join("") + '</div>';
  }

  function render() {
    var container = $("pListBody");
    if (!container) return;
    if (!all.length) {
      container.innerHTML = '<div class="empty"><h2>Nothing built yet</h2>'
        + '<p>Everything you build with Souqi Code will show up here.</p>'
        + '<a class="btn-d" href="/agent">Start building</a></div>';
      return;
    }
    var list = currentFiltered();
    if (!list.length) {
      container.innerHTML = '<div class="empty"><h2>No matches</h2><p>Try a different search or filter.</p></div>';
      return;
    }
    container.innerHTML = view === "list" ? renderRows(list) : renderGrid(list);
  }

  fetch("/api/projects?kind=code&limit=200").then(function (r) { return r.json(); }).then(function (d) {
    all = d.projects || [];
    render();
  }).catch(function () {
    var container = $("pListBody");
    if (container) container.innerHTML = '<div class="empty"><h2>Couldn\'t load your projects</h2><p>Try reloading the page.</p></div>';
  });

  $("q").addEventListener("input", render);
  $("fStatus").addEventListener("change", render);
  $("fType").addEventListener("change", render);
  $("vGrid").addEventListener("click", function () { view = "grid"; $("vGrid").classList.add("on"); $("vList").classList.remove("on"); render(); });
  $("vList").addEventListener("click", function () { view = "list"; $("vList").classList.add("on"); $("vGrid").classList.remove("on"); render(); });

  document.addEventListener("click", function (e) {
    var star = e.target.closest(".star"); if (!star) return;
    var next = star.dataset.fav !== "1";
    star.classList.toggle("on", next); star.dataset.fav = next ? "1" : "0";
    var p = all.find(function (x) { return x.slug === star.dataset.slug; });
    if (p) p.favorite = next;
    fetch("/api/codeagent/" + encodeURIComponent(star.dataset.slug) + "/favorite", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ favorite: next })
    }).catch(function () {});
  });
})();
</script>

</body>
</html>
