<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>Payment received — Souqi</title>
<!-- Same theme bootstrap as every other page: the app follows an explicit
     choice stored in localStorage and DEFAULTS TO LIGHT, deliberately
     ignoring the OS setting. These two pages originally used
     prefers-color-scheme, which made them the only ones in the app that
     went dark on a dark-mode machine while everything around them stayed
     light. Runs before first paint, so there is no flash. -->
<script>
(function(){var k="souqi-theme",p="light";try{p=localStorage.getItem(k)||"light"}catch(e){}var m=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)");var r=function(){return (p==="dark"||p==="light")?p:((m&&m.matches)?"dark":"light")};document.documentElement.setAttribute("data-theme",r());if(m){var f=function(){try{p=localStorage.getItem(k)||"light"}catch(e){}if(p!=="dark"&&p!=="light")document.documentElement.setAttribute("data-theme",r())};m.addEventListener?m.addEventListener("change",f):m.addListener&&m.addListener(f)}})();
</script>
<link rel="stylesheet" href="/styles/pages/pay-success.css">
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>Payment received</h1>
  <p>Thank you — your payment went through. A receipt is on its way to the email you gave Stripe.</p>
  <div class="ref" id="ref" hidden></div>
  <a class="btn" href="/">Done</a>
</div>
<script>
  // Stripe appends ?session_id=cs_… — show it so a shopper has something to
  // quote to the seller. It is a session reference, not a payment credential.
  (function () {
    var id = new URLSearchParams(location.search).get("session_id");
    if (!id || !/^cs_[A-Za-z0-9_]+$/.test(id)) return;
    var el = document.getElementById("ref");
    el.textContent = "Reference: " + id;
    el.hidden = false;
  })();
</script>
</body>
</html>
